name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_notes_version: ${{ steps.release.outputs.release_notes_version }}
      release_kind: ${{ steps.release.outputs.release_kind }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate release tag and package versions
        id: release
        if: github.event_name == 'push'
        run: node scripts/release-tag.mjs

  verify:
    needs: release-metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  remote-runtime-artifacts:
    name: Remote runtime (${{ matrix.target }})
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RUSTUP_MAX_RETRIES: 5
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Rust toolchain and native target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install native musl linker
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and validate matching remote runtime
        run: npm run gate:ssh:native
      - name: Preserve remote runtime permissions
        run: |
          tar -C remote/kmuxd/dist \
            -cf "$RUNNER_TEMP/remote-runtime-${{ matrix.target }}.tar" \
            "${{ matrix.target }}"
      - name: Upload remote runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: remote-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/remote-runtime-${{ matrix.target }}.tar
          if-no-files-found: error
          compression-level: 0

  package-macos:
    needs:
      - release-metadata
      - remote-runtime-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
      - name: Prepare Apple notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          {
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - name: Download remote runtime artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: remote-runtime-*
          path: ${{ runner.temp }}/remote-runtime-artifacts
          merge-multiple: true
      - name: Restore remote runtime artifacts
        run: |
          mkdir -p remote/kmuxd/dist
          for target in darwin-arm64 darwin-x64 linux-arm64-musl linux-x64-musl; do
            archive="$RUNNER_TEMP/remote-runtime-artifacts/remote-runtime-$target.tar"
            test -f "$archive"
            tar -xf "$archive" -C remote/kmuxd/dist
          done
      - run: npm run verify:remote:artifacts
      - run: npm run build
      - run: npm run rebuild:electron
      - name: Package macOS release assets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KMUX_REQUIRE_SIGNING: "1"
        run: |
          extra_args=()
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            extra_args+=("-c.publish.channel=latest-arm64")
          fi
          npm run dist:mac --workspace @kmux/desktop -- --${{ matrix.arch }} -c.forceCodeSigning=true "${extra_args[@]}"
      - name: Verify signature, notarization, and update assets
        run: |
          app_path="$(find apps/desktop/release -maxdepth 2 -name '*.app' | head -n 1)"
          dmg_path="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' | head -n 1)"
          zip_path="$(find apps/desktop/release -maxdepth 1 -name '*.zip' | head -n 1)"
          manifest_path="$(find apps/desktop/release -maxdepth 1 -name 'latest*-mac.yml' | head -n 1)"
          test -n "$app_path"
          test -n "$dmg_path"
          test -n "$zip_path"
          test -n "$manifest_path"
          codesign --verify --deep --strict "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
      - name: Smoke packaged DMG
        run: npm run smoke:packaged:mac
      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-release-assets
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest*-mac.yml
          if-no-files-found: error
          compression-level: 0

  package-linux:
    needs:
      - release-metadata
      - remote-runtime-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download remote runtime artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: remote-runtime-*
          path: ${{ runner.temp }}/remote-runtime-artifacts
          merge-multiple: true
      - name: Restore remote runtime artifacts
        run: |
          mkdir -p remote/kmuxd/dist
          for target in darwin-arm64 darwin-x64 linux-arm64-musl linux-x64-musl; do
            archive="$RUNNER_TEMP/remote-runtime-artifacts/remote-runtime-$target.tar"
            test -f "$archive"
            tar -xf "$archive" -C remote/kmuxd/dist
          done
      - run: npm run verify:remote:artifacts:cross-host
      - run: npm run build
      - run: npm run rebuild:electron
      - name: Package Linux release assets
        run: npm run dist:linux --workspace @kmux/desktop -- --${{ matrix.arch }}
      - name: Verify Linux release assets
        run: |
          appimage="apps/desktop/release/kmux-linux-${{ matrix.arch }}.AppImage"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            manifest="apps/desktop/release/latest-linux.yml"
          else
            manifest="apps/desktop/release/latest-linux-${{ matrix.arch }}.yml"
          fi
          test -s "$appimage"
          test -s "${appimage}.blockmap"
          test -s "$manifest"
      - name: Smoke packaged AppImage directly under Xvfb
        run: xvfb-run --auto-servernum npm run smoke:packaged:linux -- --allow-any-linux-desktop
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-release-assets
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.blockmap
            apps/desktop/release/latest-linux*.yml
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: github.event_name == 'push'
    needs:
      - release-metadata
      - verify
      - package-macos
      - package-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true
      - name: Verify update manifest assets
        run: |
          shopt -s nullglob
          mac_manifests=(release-assets/latest*-mac.yml)
          linux_manifests=(release-assets/latest-linux*.yml)
          zips=(release-assets/*.zip)
          appimages=(release-assets/*.AppImage)
          appimage_blockmaps=(release-assets/*.AppImage.blockmap)
          test "${#mac_manifests[@]}" -eq 2
          test "${#linux_manifests[@]}" -eq 2
          test "${#zips[@]}" -gt 0
          test "${#appimages[@]}" -eq 2
          test "${#appimage_blockmaps[@]}" -eq 2
          test -s release-assets/latest-linux.yml
          test -s release-assets/latest-linux-arm64.yml
          test -s release-assets/kmux-linux-x64.AppImage
          test -s release-assets/kmux-linux-x64.AppImage.blockmap
          test -s release-assets/kmux-linux-arm64.AppImage
          test -s release-assets/kmux-linux-arm64.AppImage.blockmap
      - name: Create macOS versionless download aliases
        run: |
          shopt -s nullglob
          for arch in arm64 x64; do
            matches=(release-assets/kmux-*-mac-${arch}.dmg)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly 1 source DMG for $arch, found ${#matches[@]}: ${matches[*]:-<none>}" >&2
              exit 1
            fi
            cp "${matches[0]}" "release-assets/kmux-mac-${arch}.dmg"
          done
          test -f release-assets/kmux-mac-arm64.dmg
          test -f release-assets/kmux-mac-x64.dmg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES_VERSION: ${{ needs.release-metadata.outputs.release_notes_version }}
          RELEASE_KIND: ${{ needs.release-metadata.outputs.release_kind }}
          IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
        run: |
          shopt -s nullglob
          assets=(
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.AppImage.blockmap
            release-assets/*.zip
            release-assets/latest*-mac.yml
            release-assets/latest-linux*.yml
          )
          test "${#assets[@]}" -gt 0
          case "$RELEASE_KIND:$IS_PRERELEASE" in
            stable:false)
              release_args=(--latest --prerelease=false)
              ;;
            prerelease:true)
              release_args=(--latest=false --prerelease)
              ;;
            *)
              echo "Invalid release metadata: kind=$RELEASE_KIND prerelease=$IS_PRERELEASE" >&2
              exit 1
              ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              "${release_args[@]}"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            notes_args=(--generate-notes)
            release_notes_path="docs/release-notes/v${RELEASE_NOTES_VERSION}.md"
            if [ -f "$release_notes_path" ] && grep -q '[^[:space:]]' "$release_notes_path"; then
              temporary_release_notes="$RUNNER_TEMP/${GITHUB_REF_NAME}-release-notes.md"
              node scripts/release-notes.mjs \
                --tag "$GITHUB_REF_NAME" \
                --repository "$GITHUB_REPOSITORY" \
                --output "$temporary_release_notes"
              notes_args+=(--notes-file "$temporary_release_notes")
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi

  update-homebrew-cask:
    name: Update Homebrew Cask
    if: >-
      github.event_name == 'push' &&
      needs.release-metadata.outputs.release_kind == 'stable' &&
      needs.release-metadata.outputs.is_prerelease == 'false'
    needs:
      - release-metadata
      - publish-release
    runs-on: macos-15
    permissions:
      contents: read
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: kmux
      - name: Validate Homebrew Tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Missing required GitHub secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi
      - name: Check out Homebrew Tap
        uses: actions/checkout@v6
        with:
          repository: kkd927/homebrew-kmux
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0
      - name: Download macOS release assets
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*-release-assets
          path: release-assets
          merge-multiple: true
      - name: Prepare Homebrew validation Tap
        run: brew tap --custom-remote kkd927/kmux "$GITHUB_WORKSPACE/homebrew-tap"
      - name: Update and push Homebrew Cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          VERSION: ${{ needs.release-metadata.outputs.version }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          arm64_dmg="../release-assets/kmux-${VERSION}-mac-arm64.dmg"
          x64_dmg="../release-assets/kmux-${VERSION}-mac-x64.dmg"
          test -f "$arm64_dmg"
          test -f "$x64_dmg"
          tap_cask="$(brew --repository kkd927/kmux)/Casks/kmux.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            node ../kmux/scripts/generate-homebrew-cask.mjs \
              --version "$VERSION" \
              --dmg "$arm64_dmg" \
              --dmg "$x64_dmg" \
              --current-cask Casks/kmux.rb \
              --output Casks/kmux.rb

            if git diff --quiet -- Casks/kmux.rb; then
              echo "Homebrew Cask is already current for kmux ${VERSION}."
              exit 0
            fi

            git diff --check -- Casks/kmux.rb
            cp Casks/kmux.rb "$tap_cask"
            brew style --cask "$tap_cask"
            brew audit --cask --strict --online kkd927/kmux/kmux

            git add Casks/kmux.rb
            git commit -m "Update kmux to ${VERSION}"
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push the Homebrew Cask after ${attempt} attempts." >&2
              exit 1
            fi

            git fetch origin main:refs/remotes/origin/main
            git switch --detach origin/main
          done
